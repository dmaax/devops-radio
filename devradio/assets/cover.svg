    <text x="52" y="520" fill="url(#title)" font-size="205" font-weight="800" letter-spacing="-6" filter="url(#glow)">Radio</text>

    <!-- prompt -->
    <text x="60" y="585" fill="#22d3ee" font-size="38" letter-spacing="1"><tspan fill="#1ed760">$</tspan> git push --vibes<tspan fill="#1ed760">▍</tspan></text>

