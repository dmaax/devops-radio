  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#g1)"/>
  <rect width="1000" height="1000" fill="url(#g2)"/>
  <g stroke="#fff" stroke-opacity="0.04" stroke-width="2"><path d="M0 200H1000M0 400H1000M0 600H1000M0 800H1000M200 0V1000M400 0V1000M600 0V1000M800 0V1000"/></g>

  <g font-family="'Ubuntu Sans Mono','Ubuntu Mono','DejaVu Sans Mono',monospace">
    <!-- ON AIR -->
    <g transform="translate(60 70)">
      <rect width="210" height="58" rx="29" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="3"/>
      <circle cx="34" cy="29" r="11" fill="#ef4444" filter="url(#glow)"/>
      <text x="58" y="40" fill="#fca5a5" font-size="30" font-weight="700" letter-spacing="4">ON AIR</text>
    </g>
    <text x="940" y="110" text-anchor="end" fill="#8b95c9" font-size="28" letter-spacing="3">TODO DIA · 06:00</text>

