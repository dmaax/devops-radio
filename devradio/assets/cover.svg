<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>DevOps Radio — capa</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="0.6" stop-color="#121637"/><stop offset="1" stop-color="#2b0b3f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.15" cy="0.12" r="0.55"><stop offset="0" stop-color="#1ed760" stop-opacity="0.28"/><stop offset="1" stop-color="#1ed760" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.95" cy="0.9" r="0.6"><stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1ed760"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
